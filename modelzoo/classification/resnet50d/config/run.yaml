# Copyright 2026 NXP

modelname: "resnet50d"
out: "../output"
precompiled_model_link_path: "./tmp/path/to/dvm"


network:
    srcfw: "onnx"
    inet: ../output/compiled_model/model.onnx
    iwt: ../output/compiled_model/model.onnx
    dim: "3,224,224"
    tags: null
    label: null
    pcfg: null
    images:
        quantize: ../output/preprocessed_images_quantize
        verify: ../output/preprocessed_images_verify


dvconvert:
    lname: null
    lshape: null
    np: False
    inode: "input"
    onode: "516"
    rsmax: False
    ignore_mse: False
    state_name: null
    state_shape: null
    tg: True
    dynamic: false
    dynamic_input: false
    no_final_perm_opt: false
    dformat: null


dvnc:
    layeroutput: False
    qmode: 9
    qonly: False
    bc: False
    adjust: null
    asymmetric: false
    clampqlimits: true
    use_tf_enhanced_encoding: true


inference:
    endpoint: 0
    interface: IPV4
    socket: "127.0.0.1:5000"


preprocess:
    input_shape:
        c: 3
        h: 224
        w: 224
    mean:
        r: 123.68
        g: 116.28
        b: 103.53
    scale:
        r: 0.017125
        g: 0.017507
        b: 0.017429
    resize:
        resize_size: 256
        aspect_ratio: True
        scale: 1
        interpolation: BICUBIC
        padding: null
    centercrop:
      h: 224
      w: 224
    bgr_to_rgb: True
    to_float: True
    hwc_to_chw: True


postprocess:
    tags: ../output/tags.txt
    label: ""
    image_overlay: True
    dump_output: False
    top_k: 10


calibration_data:
    quantize: ../output/quant
    verify: null
    quantize_list: ./calibration_image_set.txt


evaluation:
    type: imagenet
    split: val


quantization:
    quantization_config: ./quantization_config.json
